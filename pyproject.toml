[project]
name = "family-medical-board"
version = "0.2.0"
description = "Record keeping and a question-listing board for family caregivers of elderly parents. Never gives medical advice."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "bcrypt>=4.0",
    "fastapi>=0.110",
    "fpdf2>=2.7",
    "numpy>=1.26",
    "openai>=1.83.0",
    "pandas>=2.3.3",
    "pillow>=12.1.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.11.10",
    "pydicom>=3.0.1",
    "pymupdf>=1.24",
    "pypdf>=6.6.2",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.53.1",
    "uvicorn>=0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
