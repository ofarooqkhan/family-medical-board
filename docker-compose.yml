# Local development stack: Postgres 16 plus the app image built from ./Dockerfile.
#   export OPENAI_API_KEY=sk-...
#   docker compose up --build
# Then open http://localhost:5000. Postgres data lives in the pgdata volume.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medboard"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/medboard
      PORT: "5000"
      # Passed through from the host environment; unset on the host means unset here.
      OPENAI_API_KEY:
      ANTHROPIC_API_KEY:
    ports:
      - "5000:5000"

volumes:
  pgdata:
